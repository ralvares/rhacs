apiVersion: v1
kind: ServiceAccount
metadata:
  name: stackrox-image-integration-updater
  namespace: stackrox
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: stackrox-internal-registry-integration
  namespace: stackrox
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: stackrox-internal-registry-integration
    spec:
      serviceAccountName: stackrox-image-integration-updater
      restartPolicy: Never
      containers:
        - name: configure
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: CENTRAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: central-htpasswd
                  key: password
            - name: REGISTRY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: stackrox-image-puller-token
                  key: token
            - name: CENTRAL_URL
              value: https://central.stackrox.svc:443
            - name: REGISTRY_ENDPOINT
              value: image-registry.openshift-image-registry.svc:5000
            - name: INTEGRATION_NAME
              value: OpenShift internal registry - stackrox image puller
          command: [python3, -c]
          args:
            - |
              import base64
              import json
              import os
              import ssl
              import time
              import urllib.request

              central = os.environ["CENTRAL_URL"].rstrip("/")
              endpoint = os.environ["REGISTRY_ENDPOINT"]
              name = os.environ["INTEGRATION_NAME"]
              password = os.environ["CENTRAL_PASSWORD"]
              registry_token = os.environ["REGISTRY_TOKEN"]
              basic = base64.b64encode(("admin:" + password).encode()).decode()
              context = ssl._create_unverified_context()

              def request(method, path, body=None):
                  data = None if body is None else json.dumps(body).encode()
                  req = urllib.request.Request(
                      central + path,
                      data=data,
                      method=method,
                      headers={
                          "Authorization": "Basic " + basic,
                          "Content-Type": "application/json",
                      },
                  )
                  with urllib.request.urlopen(req, context=context, timeout=30) as response:
                      raw = response.read()
                      return {} if not raw else json.loads(raw)

              for attempt in range(60):
                  try:
                      request("GET", "/v1/metadata")
                      break
                  except Exception:
                      if attempt == 59:
                          raise
                      time.sleep(5)

              integrations = request("GET", "/v1/imageintegrations").get("integrations", [])
              candidates = [item for item in integrations if item.get("docker", {}).get("endpoint") == endpoint]
              preferred = next((item for item in candidates if item.get("name") == name), None)
              previous = next((item for item in candidates if item.get("name") == "OpenShift internal registry - ai-email-demo"), None)
              selected = preferred or previous or (candidates[0] if candidates else None)

              payload = {
                  "name": name,
                  "type": "docker",
                  "categories": ["REGISTRY"],
                  "docker": {
                      "endpoint": endpoint,
                      "username": "stackrox-image-puller",
                      "password": registry_token,
                      "insecure": True,
                  },
                  "autogenerated": False,
                  "skipTestIntegration": False,
              }

              if selected:
                  integration_id = selected["id"]
                  payload["id"] = integration_id
                  request("PUT", "/v1/imageintegrations/" + integration_id + "?updatePassword=true", payload)
                  action = "updated"
              else:
                  created = request("POST", "/v1/imageintegrations", payload)
                  integration_id = created["id"]
                  action = "created"

              print(action + " RHACS integration " + name + " (" + integration_id + ")")
              print("registry identity: system:serviceaccount:stackrox:stackrox-image-puller")
              print("credential source: stable in-cluster ServiceAccount token Secret")
