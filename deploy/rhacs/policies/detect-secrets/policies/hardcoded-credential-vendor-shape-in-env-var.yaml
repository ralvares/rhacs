      - value: RAW=(?-i:(?i).*(?:jfrog|artifactory|bintray|xray).*)=(?-i:(?i)[a-z0-9]{73})
      - value: RAW=(?-i:(?i).*(?:jfrog|artifactory|bintray|xray).*)=(?-i:(?i)[a-z0-9]{64})
  - sectionName: Payments and commerce
