      - value: RAW=(?-i:(?i).*(?:dropbox).*)=(?-i:(?i)sl\.[a-z0-9\-\x3d_]{135})
      - value: RAW=(?-i:(?i).*(?:facebook).*)=(?-i:(?i)[a-f0-9]{32})
      - value: RAW=(?-i:(?i).*(?:finnhub).*)=(?-i:(?i)[a-z0-9]{20})
      - value: RAW=(?-i:(?i).*(?:flickr).*)=(?-i:(?i)[a-z0-9]{32})
