      - value: RAW=(?-i:(?i).*(?:linear).*)=(?-i:(?i)[a-f0-9]{32})
      - value: RAW=(?-i:(?i).*(?:linked[_-]?in).*)=(?-i:(?i)[a-z0-9]{16})
