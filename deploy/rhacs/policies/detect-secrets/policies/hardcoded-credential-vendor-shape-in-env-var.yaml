apiVersion: config.stackrox.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: hardcoded-credential-vendor-shape-in-env-var
  namespace: stackrox
spec:
  policyName: Hardcoded Credential in Environment Variable (vendor name and token shape)
  description: Alerts when an environment variable whose name contains a vendor or product name holds a value matching that vendor's token format (e.g. a variable containing DATADOG holding a 32-character hex key).
  rationale: 'Two independent signals are required to fire: the vendor name in the variable name and the vendor''s token shape in the value. Neither alone is sufficient, which keeps configuration variables (DATADOG_SITE=datadoghq.eu) quiet. Derived from the gitleaks keyword rules (105 vendors).'
  remediation: 'Move the value into a Kubernetes Secret referenced via secretKeyRef, or source it from an external store (Vault, External Secrets Operator). Rotate the exposed credential: it must be considered compromised.'
  categories:
  - Security Best Practices
  severity: HIGH_SEVERITY
  lifecycleStages:
  - DEPLOY
  disabled: false
  policySections:
  - sectionName: AI and ML services
    policyGroups:
    - fieldName: Environment Variable
      booleanOperator: OR
      values:
      - value: RAW=(?-i:(?i).*(?:cohere|CO_API_KEY).*)=(?-i:(?i)[a-zA-Z0-9]{40})
      - value: RAW=(?-i:(?i).*(?:private[_-]?ai).*)=(?-i:(?i)[a-z0-9]{32})
  - sectionName: Cloud providers
    policyGroups:
    - fieldName: Environment Variable
      booleanOperator: OR
      values:
      - value: RAW=(?-i:(?i).*(?:alibaba).*)=(?-i:(?i)[a-z0-9]{30})
      - value: RAW=(?-i:(?i).*(?:cloudflare).*)=(?-i:(?i)[a-z0-9_-]{40})
      - value: RAW=(?-i:(?i).*(?:cloudflare).*)=(?-i:(?i)[a-f0-9]{37})
      - value: RAW=(?-i:(?i).*(?:confluent).*)=(?-i:(?i)[a-z0-9]{16})
      - value: RAW=(?-i:(?i).*(?:confluent).*)=(?-i:(?i)[a-z0-9]{64})
      - value: RAW=(?-i:(?i).*(?:fastly).*)=(?-i:(?i)[a-z0-9\x3d_\-]{32})
      - value: RAW=(?-i:(?i).*(?:heroku).*)=(?-i:(?i)[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})
      - value: RAW=(?-i:(?i).*(?:netlify).*)=(?-i:(?i)[a-z0-9\x3d_\-]{40,46})
      - value: RAW=(?-i:(?i).*(?:yandex).*)=(?-i:(?i)t1\.[A-Z0-9a-z_-]+[\x3d]{0,2}\.[A-Z0-9a-z_-]{86}[\x3d]{0,2})
      - value: RAW=(?-i:(?i).*(?:yandex).*)=(?-i:(?i)AQVN[A-Za-z0-9_\-]{35,38})
      - value: RAW=(?-i:(?i).*(?:yandex).*)=(?-i:(?i)YC[a-zA-Z0-9_\-]{38})
      - value: RAW=(?-i:(?i).*(?:azure|storage|blob).*)=(?-i:[A-Za-z0-9+/]{86}\x3d\x3d)
  - sectionName: Common or default password value
    policyGroups:
    - fieldName: Environment Variable
      booleanOperator: OR
      values:
      - value: RAW=(?-i:(?i).*(PASSWORD|PASSWD|PWD|_PASS|SECRET|TOKEN|_KEY|AUTH))=(?-i:(?i)(?:1111|1234|asdf|love|pass|11111|12345|apple|hello|qwert|000000|010203|101010|102030|111111|112233|121212|123123|123321|123456|12345a|123654|123abc|123qwe|131313|147258|159357|159753|1q2w3e|222222|333333|555555|654321|666666|696969|777777|789456|888888|987654|999999|Status|a12345|aaaaaa|abc123|amanda|andrea|andrew|angel1|asd123|asdasd|asdfgh|ashley|azerty|batman|bitch1|buster|daniel|dragon|flower|george|gfhjkm|golfer|gwerty|hannah|hello1|hunter|iloveu|jesus1|jordan|joshua|justin|killer|lovely|loveme|maggie|marina|master|money1|monkey|mother|naruto|nicole|parola|purple|qazwsx|qwe123|qwerty|robert|secret|shadow|soccer|summer|thomas|tigger|tinkle|zxcvbn|1111111|1234567|123456a|123456q|5201314|7777777|a123456|anthony|charlie|chelsea|example|freedom|friends|fuckyou|jessica|letmein|love123|matthew|michael|monkey1|number1|pokemon|qwerty1|samsung|soccer1|welcome|william|zxcvbnm|11111111|12345678|1234qwer|12qwaszx|1g2w3e4r|1q2w3e4r|1qaz2wsx|88888888|abcd1234|anthony1|asdf1234|asshole1|babygirl|baseball|blink182|changeme|charlie1|computer|football|fuckyou1|fuckyou2|fuk19600|iloveyou|j38ifUbn|jennifer|jessica1|jordan23|linkedin|michael1|michelle|myspace1|pakistan|passw0rd|password|princess|q1w2e3r4|qwer1234|qwerty12|samantha|sunshine|superman|trustno1|zag12wsx|123123123|123456789|147258369|789456123|987654321|asdfghjkl|babygirl1|baseball1|butterfly|chocolate|football1|gwerty123|iloveyou1|iloveyou2|liverpool|password1|princess1|qazwsxedc|qwerty123|superman1|target123|0123456789|0987654321|1111111111|1234567890|123456789a|1q2w3e4r5t|FQRG7CS493|basketball|homelesspa|passer2009|qwertyuiop|my\-password|my\-secret\-pw|q1w2e3r4t5y6|my_cool_secret|strongpassword|mysecretpassword))
  - sectionName: Database and datastore images (documented password variables)
    policyGroups:
    - fieldName: Environment Variable
      booleanOperator: OR
      values:
      - value: RAW=(?-i:CLICKHOUSE_PASSWORD)=(?-i:.+)
      - value: RAW=(?-i:COUCHDB_PASSWORD)=(?-i:.+)
      - value: RAW=(?-i:DOCKER_INFLUXDB_INIT_PASSWORD)=(?-i:.+)
      - value: RAW=(?-i:MARIADB_PASSWORD)=(?-i:.+)
      - value: RAW=(?-i:MARIADB_ROOT_PASSWORD)=(?-i:.+)
      - value: RAW=(?-i:MONGO_INITDB_ROOT_PASSWORD)=(?-i:.+)
      - value: RAW=(?-i:MYSQL_OPERATIONS_PASSWORD)=(?-i:.+)
      - value: RAW=(?-i:MYSQL_PASSWORD)=(?-i:.+)
      - value: RAW=(?-i:MYSQL_ROOT_PASSWORD)=(?-i:.+)
      - value: RAW=(?-i:NEO4J_AUTH)=(?-i:[^/\s]+/.+)
      - value: RAW=(?-i:PGPASSWORD)=(?-i:.+)
      - value: RAW=(?-i:POSTGRESQL_ADMIN_PASSWORD)=(?-i:.+)
      - value: RAW=(?-i:POSTGRESQL_MIGRATION_ADMIN_PASSWORD)=(?-i:.+)
      - value: RAW=(?-i:POSTGRESQL_PASSWORD)=(?-i:.+)
      - value: RAW=(?-i:POSTGRES_PASSWORD)=(?-i:.+)
      - value: RAW=(?-i:RABBITMQ_DEFAULT_PASS)=(?-i:.+)
      - value: RAW=(?-i:REDIS_PASSWORD)=(?-i:.+)
      - value: RAW=(?-i:VALKEY_PASSWORD)=(?-i:.+)
  - sectionName: Messaging and communications
    policyGroups:
    - fieldName: Environment Variable
      booleanOperator: OR
      values:
      - value: RAW=(?-i:(?i).*(?:beamer).*)=(?-i:(?i)b_[a-z0-9\x3d_\-]{44})
      - value: RAW=(?-i:(?i).*(?:discord).*)=(?-i:(?i)[a-f0-9]{64})
      - value: RAW=(?-i:(?i).*(?:discord).*)=(?-i:(?i)[a-z0-9\x3d_\-]{32})
      - value: RAW=(?-i:(?i).*(?:gitter).*)=(?-i:(?i)[a-z0-9_-]{40})
      - value: RAW=(?-i:(?i).*(?:intercom).*)=(?-i:(?i)[a-z0-9\x3d_\-]{60})
      - value: RAW=(?-i:(?i).*(?:MailchimpSDK.initialize|mailchimp).*)=(?-i:(?i)[a-f0-9]{32}-us\d\d)
      - value: RAW=(?-i:(?i).*(?:mailgun).*)=(?-i:(?i)key-[a-f0-9]{32})
      - value: RAW=(?-i:(?i).*(?:mailgun).*)=(?-i:(?i)[a-h0-9]{32}-[a-h0-9]{8}-[a-h0-9]{8})
      - value: RAW=(?-i:(?i).*(?:mattermost).*)=(?-i:(?i)[a-z0-9]{26})
      - value: RAW=(?-i:(?i).*(?:message[_-]?bird).*)=(?-i:(?i)[a-z0-9]{25})
      - value: RAW=(?-i:(?i).*(?:sendbird).*)=(?-i:(?i)[a-f0-9]{40})
      - value: RAW=(?-i:(?i).*(?:telegr).*)=(?-i:(?i)[0-9]{5,16}:(?-i:A)[a-z0-9_\-]{34})
      - value: RAW=(?-i:(?i).*(?:typeform).*)=(?-i:(?i)tfp_[a-z0-9\-_\.\x3d]{59})
      - value: RAW=(?-i:(?i).*(?:zendesk).*)=(?-i:(?i)[a-z0-9]{40})
  - sectionName: Observability
    policyGroups:
    - fieldName: Environment Variable
      booleanOperator: OR
      values:
      - value: RAW=(?-i:(?i).*(?:(?-i:[Mm]eraki|MERAKI)).*)=(?-i:(?i)[0-9a-f]{40})
      - value: RAW=(?-i:(?i).*(?:datadog|DD_API_KEY|DD_APP_KEY).*)=(?-i:(?i)[a-z0-9]{40})
      - value: RAW=(?-i:(?i).*(?:launchdarkly).*)=(?-i:(?i)[a-z0-9\x3d_\-]{40})
      - value: RAW=(?-i:(?i).*(?:new-relic|newrelic|new_relic).*)=(?-i:(?i)NRII-[a-z0-9-]{32})
      - value: RAW=(?-i:(?i).*(?:new-relic|newrelic|new_relic).*)=(?-i:(?i)NRAK-[a-z0-9]{27})
      - value: RAW=(?-i:(?i).*(?:sentry).*)=(?-i:(?i)[a-f0-9]{64})
      - value: RAW=(?-i:(?i).*(?:(?-i:[Ss]umo|SUMO)).*)=(?-i:(?i)[a-z0-9]{64})
  - sectionName: Other SaaS and APIs
    policyGroups:
    - fieldName: Environment Variable
      booleanOperator: OR
      values:
