apiVersion: config.stackrox.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: opaque-value-in-credential-named-env-var
  namespace: stackrox
spec:
  policyName: Opaque Value in Credential-Named Environment Variable
  description: Alerts when an environment variable whose name ends on a credential noun holds a value with the shape of a token, key or password rather than a resource name, path, image reference or version string.
  rationale: 'Heuristic. Approximates entropy scoring with length and character-class diversity, the closest achievable check with regex-only criteria. The name must END on the credential noun: in ecosystem conventions the suffix carries the semantics (_NAME is a reference, _PATH is a location, SECRETS plural is a project name), so CLOUD_CREDENTIALS_SECRET_NAME, VAULT_SECRET_PATH and RELATED_IMAGE_EXTERNAL_SECRETS are excluded structurally.'
  remediation: 'Move the value into a Kubernetes Secret referenced via secretKeyRef, or source it from an external store (Vault, External Secrets Operator). Rotate the exposed credential: it must be considered compromised. If this is a false positive, prefer narrowing the value regex over adding a deployment exclusion.'
  categories:
  - Security Best Practices
  severity: MEDIUM_SEVERITY
  lifecycleStages:
  - DEPLOY
  disabled: false
  policySections:
  - sectionName: Credential-named key with opaque value
    policyGroups:
    - fieldName: Environment Variable
      booleanOperator: OR
      values:
      - value: RAW=(?-i:(?i).*(SECRET|PASSWORD|PASSWD|PWD|TOKEN|APIKEY|API_KEY|CREDENTIAL|CREDENTIALS|ACCESS_KEY|PRIVATE_KEY|KEY|AUTH))=(?-i:[A-Za-z0-9+/\x3d_.-]*([A-Z][A-Za-z0-9+/\x3d_.-]*[0-9]|[0-9][A-Za-z0-9+/\x3d_.-]*[A-Z])[A-Za-z0-9+/\x3d_.-]{10,})
      - value: RAW=(?-i:(?i).*(SECRET|PASSWORD|PASSWD|PWD|TOKEN|APIKEY|API_KEY|CREDENTIAL|CREDENTIALS|ACCESS_KEY|PRIVATE_KEY|KEY|AUTH))=(?-i:[A-Fa-f0-9]{32,})
      - value: RAW=(?-i:(?i).*(SECRET|PASSWORD|PASSWD|PWD|TOKEN|APIKEY|API_KEY|CREDENTIAL|CREDENTIALS|ACCESS_KEY|PRIVATE_KEY|KEY|AUTH))=(?-i:[A-Za-z0-9+/]{24,}\x3d{1,2})
