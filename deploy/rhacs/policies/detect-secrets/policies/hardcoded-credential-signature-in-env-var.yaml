apiVersion: config.stackrox.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: hardcoded-credential-signature-in-env-var
  namespace: stackrox
spec:
  policyName: Hardcoded Credential in Environment Variable (signature match)
  description: Alerts when a container environment variable holds a value matching a known, self-identifying credential format (cloud keys, SCM tokens, API keys, private keys, JWTs, URIs with embedded credentials) regardless of the variable name.
  rationale: 'Signature-based: the token format itself identifies it. No dependence on variable naming, so resource references, image references and paths never trigger it, and credentials in innocuously named variables are still caught. Derived from the gitleaks default ruleset (123 signatures).'
  remediation: 'Move the value into a Kubernetes Secret referenced via secretKeyRef, or source it from an external store (Vault, External Secrets Operator). Rotate the exposed credential: it must be considered compromised.'
  categories:
  - Security Best Practices
  severity: HIGH_SEVERITY
  lifecycleStages:
  - DEPLOY
  disabled: false
  policySections:
  - sectionName: AI and ML services
    policyGroups:
    - fieldName: Environment Variable
      booleanOperator: OR
      values:
      - value: RAW=(?-i:.*)=(?-i:.*\b(sk-ant-admin01-[a-zA-Z0-9_\-]{93}AA).*)
      - value: RAW=(?-i:.*)=(?-i:.*\b(sk-ant-api03-[a-zA-Z0-9_\-]{93}AA).*)
      - value: RAW=(?-i:.*)=(?-i:.*\b(hf_(?i:[a-z]{34})).*)
      - value: RAW=(?-i:.*)=(?-i:.*\b(api_org_(?i:[a-z]{34})).*)
      - value: RAW=(?-i:.*)=(?-i:.*\b(sk-(?:proj|svcacct|admin)-(?:[A-Za-z0-9_-]{74}|[A-Za-z0-9_-]{58})T3BlbkFJ(?:[A-Za-z0-9_-]{74}|[A-Za-z0-9_-]{58})\b|sk-[a-zA-Z0-9]{20}T3BlbkFJ[a-zA-Z0-9]{20}).*)
      - value: RAW=(?-i:.*)=(?-i:.*\b(pplx-[a-zA-Z0-9]{48})(?:[\x60'"\s;]|\\[nr]|$|\b).*)
  - sectionName: Cloud providers
    policyGroups:
    - fieldName: Environment Variable
      booleanOperator: OR
      values:
      - value: RAW=(?-i:.*)=(?-i:.*\b(LTAI(?i)[a-z0-9]{20}).*)
      - value: RAW=(?-i:.*)=(?-i:.*\b((?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z2-7]{16})\b.*)
      - value: RAW=(?-i:.*)=(?-i:.*\b(ABSK[A-Za-z0-9+/]{109,269}\x3d{0,2}).*)
      - value: RAW=(?-i:.*)=(?-i:.*bedrock-api-key-YmVkcm9jay5hbWF6b25hd3MuY29t.*)
      - value: RAW=(?-i:.*)=(?-i:(?:.*[\\'"\x60\s>\x3d:(,)])?([a-zA-Z0-9_~.]{3}\dQ~[a-zA-Z0-9_~.-]{31,34})(?:$|[\\'"\x60\s<),]).*)
      - value: RAW=(?-i:.*)=(?-i:.*\b(4b1d[A-Za-z0-9]{38})\b.*)
      - value: RAW=(?-i:.*)=(?-i:.*\b(v1\.0-[a-f0-9]{24}-[a-f0-9]{146}).*)
      - value: RAW=(?-i:.*)=(?-i:.*\b(dapi[a-f0-9]{32}(?:-\d)?).*)
      - value: RAW=(?-i:.*)=(?-i:.*\b(doo_v1_[a-f0-9]{64}).*)
      - value: RAW=(?-i:.*)=(?-i:.*\b(dop_v1_[a-f0-9]{64}).*)
      - value: RAW=(?-i:.*)=(?-i:.*(?i)\b(dor_v1_[a-f0-9]{64}).*)
      - value: RAW=(?-i:.*)=(?-i:.*\b((?:fo1_[\w-]{43}|fm1[ar]_[a-zA-Z0-9+\/]{100,}\x3d{0,3}|fm2_[a-zA-Z0-9+\/]{100,}\x3d{0,3})).*)
      - value: RAW=(?-i:.*)=(?-i:.*\b(AIza[\w-]{35}).*)
      - value: RAW=(?-i:.*)=(?-i:.*\b((HRKU-AA[0-9a-zA-Z_-]{58})).*)
      - value: RAW=(?-i:.*)=(?-i:.*\b(pscale_tkn_(?i)[\w\x3d\.-]{32,64}).*)
      - value: RAW=(?-i:.*)=(?-i:.*\b(pscale_oauth_[\w\x3d\.-]{32,64}).*)
      - value: RAW=(?-i:.*)=(?-i:.*(?i)\b(pscale_pw_(?i)[\w\x3d\.-]{32,64}).*)
      - value: RAW=(?-i:.*)=(?-i:.*\b(tk-us-[\w-]{48}).*)
  - sectionName: Connection strings and transport credentials
    policyGroups:
    - fieldName: Environment Variable
      booleanOperator: OR
      values:
      - value: RAW=(?-i:.*)=(?-i:.*\bATATT3[A-Za-z0-9_\-\x3d]{186}.*)
      - value: RAW=(?-i:.*)=(?-i:(?i)[a-z][a-z0-9+.-]*://[^:/@\s]*:[^@/\s]+@.*)
      - value: RAW=(?-i:.*)=(?-i:[a-z][a-z0-9+.-]*://[A-Za-z0-9_\-]{20,}@.*)
      - value: RAW=(?-i:.*)=(?-i:(?i).*\bbearer\s+[A-Za-z0-9._~+/-]{20,}\x3d*.*)
      - value: RAW=(?-i:.*)=(?-i:(?i).*jdbc:[a-z0-9]+:.*[?&;]password\x3d[^&;\s]+.*)
      - value: RAW=(?-i:.*)=(?-i:(?i).*jdbc:oracle:thin:[^/@\s:]+/[^@\s]+@.*)
      - value: RAW=(?-i:.*)=(?-i:(?i)(?:.*;)?\s*(?:password|pwd)\s*\x3d\s*[^;\s]+.*)
      - value: RAW=(?-i:.*)=(?-i:(?i).*\b(?:host|dbname|user)\x3d\S+.*\bpassword\x3d\S+.*)
      - value: RAW=(?-i:.*)=(?-i:(?i).*\bpassword\x3d\S+.*\b(?:host|dbname|user)\x3d\S+.*)
      - value: RAW=(?-i:.*)=(?-i:(?i).*-D[a-z0-9_.]*(?:password|passwd|pwd)\x3d\S+.*)
      - value: RAW=(?-i:.*)=(?-i:(?i).*\bbasic\s+[A-Za-z0-9+/]{16,}\x3d{0,2}(\s.*)?)
      - value: RAW=(?-i:.*)=(?-i:(?s).*"type"\s*:\s*"service_account".*"private_key".*)
      - value: RAW=(?-i:.*)=(?-i:(?s).*"auths"\s*:.*"auth"\s*:\s*"[A-Za-z0-9+/]{16,}\x3d{0,2}".*)
  - sectionName: Messaging and communications
    policyGroups:
    - fieldName: Environment Variable
      booleanOperator: OR
      values:
      - value: RAW=(?-i:.*)=(?-i:.*https://[a-z0-9]+\.webhook\.office\.com/webhookb2/[a-z0-9]{8}-([a-z0-9]{4}-){3}[a-z0-9]{12}@[a-z0-9]{8}-([a-z0-9]{4}-){3}[a-z0-9]{12}/IncomingWebhook/[a-z0-9]{32}/[a-z0-9]{8}-([a-z0-9]{4}-){3}[a-z0-9]{12}.*)
      - value: RAW=(?-i:.*)=(?-i:.*\b(PMAK-(?i)[a-f0-9]{24}\-[a-f0-9]{34}).*)
      - value: RAW=(?-i:.*)=(?-i:.*\b(SG\.(?i)[a-z0-9\x3d_\-\.]{66}).*)
      - value: RAW=(?-i:.*)=(?-i:.*\b(xkeysib-[a-f0-9]{64}\-(?i)[a-z0-9]{16}).*)
      - value: RAW=(?-i:.*)=(?-i:.*(?i)xapp-\d-[A-Z0-9]+-\d+-[a-z0-9]+.*)
      - value: RAW=(?-i:.*)=(?-i:.*xoxb-[0-9]{10,13}-[0-9]{10,13}[a-zA-Z0-9-]*.*)
      - value: RAW=(?-i:.*)=(?-i:.*(?i)xoxe.xox[bp]-\d-[A-Z0-9]{163,166}.*)
      - value: RAW=(?-i:.*)=(?-i:.*(?i)xoxe-\d-[A-Z0-9]{146}.*)
      - value: RAW=(?-i:.*)=(?-i:.*xoxb-[0-9]{8,14}-[a-zA-Z0-9]{18,26}.*)
      - value: RAW=(?-i:.*)=(?-i:.*xox[os]-\d+-\d+-\d+-[a-fA-F\d]+.*)
      - value: RAW=(?-i:.*)=(?-i:.*xox[ar]-(?:\d-)?[0-9a-zA-Z]{8,48}.*)
      - value: RAW=(?-i:.*)=(?-i:.*xox[pe](?:-[0-9]{10,13}){3}-[a-zA-Z0-9-]{28,34}.*)
      - value: RAW=(?-i:.*)=(?-i:.*(?:https?://)?hooks.slack.com/(?:services|workflows|triggers)/[A-Za-z0-9+/]{43,56}.*)
      - value: RAW=(?-i:.*)=(?-i:.*SK[0-9a-fA-F]{32}.*)
  - sectionName: Observability
    policyGroups:
    - fieldName: Environment Variable
      booleanOperator: OR
      values:
      - value: RAW=(?-i:.*)=(?-i:.*dt0c01\.(?i)[a-z0-9]{24}\.[a-z0-9]{64}.*)
      - value: RAW=(?-i:.*)=(?-i:.*(?i)\b(eyJrIjoi[A-Za-z0-9]{70,400}\x3d{0,3}).*)
      - value: RAW=(?-i:.*)=(?-i:.*(?i)\b(glc_[A-Za-z0-9+/]{32,400}\x3d{0,3}).*)
      - value: RAW=(?-i:.*)=(?-i:.*(?i)\b(glsa_[A-Za-z0-9]{32}_[A-Fa-f0-9]{8}).*)
      - value: RAW=(?-i:.*)=(?-i:.*\bsntrys_eyJpYXQiO[a-zA-Z0-9+/]{10,200}(?:LCJyZWdpb25fdXJs|InJlZ2lvbl91cmwi|cmVnaW9uX3VybCI6)[a-zA-Z0-9+/]{10,200}\x3d{0,2}_[a-zA-Z0-9+/]{43}(?:[^a-zA-Z0-9+/]|\z).*)
      - value: RAW=(?-i:.*)=(?-i:.*\b(sntryu_[a-f0-9]{64}).*)
  - sectionName: Other SaaS and APIs
    policyGroups:
    - fieldName: Environment Variable
      booleanOperator: OR
      values:
      - value: RAW=(?-i:.*)=(?-i:.*\b(p8e-(?i)[a-z0-9]{32}).*)
      - value: RAW=(?-i:.*)=(?-i:.*\b(pat[[:alnum:]]{14}\.[a-f0-9]{64})\b.*)
      - value: RAW=(?-i:.*)=(?-i:.*(?i)\b(\d{15,16}(\||%)[0-9a-z\-_]{27,40}).*)
      - value: RAW=(?-i:.*)=(?-i:.*\b(EAA[MC](?i)[a-z0-9]{100,}).*)
      - value: RAW=(?-i:.*)=(?-i:.*fio-u-(?i)[a-z0-9\-_\x3d]{64}.*)
      - value: RAW=(?-i:.*)=(?-i:.*lin_api_(?i)[a-z0-9]{40}.*)
      - value: RAW=(?-i:.*)=(?-i:.*\b([A-Za-z0-9]{6}_[A-Za-z0-9]{29}_mmk).*)
      - value: RAW=(?-i:.*)=(?-i:.*\b(ntn_[0-9]{11}[A-Za-z0-9]{32}[A-Za-z0-9]{3}).*)
      - value: RAW=(?-i:.*)=(?-i:.*\b(pnu_[a-zA-Z0-9]{36}).*)
  - sectionName: Package registries and artifacts
    policyGroups:
    - fieldName: Environment Variable
      booleanOperator: OR
      values:
      - value: RAW=(?-i:.*)=(?-i:.*\bAKCp[A-Za-z0-9]{69}\b.*)
      - value: RAW=(?-i:.*)=(?-i:.*\bcmVmd[A-Za-z0-9]{59}\b.*)
      - value: RAW=(?-i:.*)=(?-i:.*(?i)CLOJARS_[a-z0-9]{60}.*)
      - value: RAW=(?-i:.*)=(?-i:.*(?i)\b(npm_[a-z0-9]{36}).*)
      - value: RAW=(?-i:.*)=(?-i:.*pypi-AgEIcHlwaS5vcmc[\w-]{50,1000}.*)
      - value: RAW=(?-i:.*)=(?-i:.*\b(rubygems_[a-f0-9]{48}).*)
  - sectionName: Payments and commerce
    policyGroups:
    - fieldName: Environment Variable
      booleanOperator: OR
      values:
      - value: RAW=(?-i:.*)=(?-i:.*duffel_(?:test|live)_(?i)[a-z0-9_\-\x3d]{43}.*)
      - value: RAW=(?-i:.*)=(?-i:.*\bEZAK(?i)[a-z0-9]{54}\b.*)
      - value: RAW=(?-i:.*)=(?-i:.*\bEZTK(?i)[a-z0-9]{54}\b.*)
      - value: RAW=(?-i:.*)=(?-i:.*FLWSECK_TEST-(?i)[a-h0-9]{12}.*)
      - value: RAW=(?-i:.*)=(?-i:.*FLWSECK_TEST-(?i)[a-h0-9]{32}-X.*)
      - value: RAW=(?-i:.*)=(?-i:.*\b(shippo_(?:live|test)_[a-fA-F0-9]{40}).*)
      - value: RAW=(?-i:.*)=(?-i:.*shpat_[a-fA-F0-9]{32}.*)
      - value: RAW=(?-i:.*)=(?-i:.*shpca_[a-fA-F0-9]{32}.*)
      - value: RAW=(?-i:.*)=(?-i:.*shppa_[a-fA-F0-9]{32}.*)
      - value: RAW=(?-i:.*)=(?-i:.*shpss_[a-fA-F0-9]{32}.*)
      - value: RAW=(?-i:.*)=(?-i:.*\b((?:EAAA|sq0atp-)[\w-]{22,60}).*)
      - value: RAW=(?-i:.*)=(?-i:.*\b((?:sk|rk)_(?:test|live|prod)_[a-zA-Z0-9]{10,99}).*)
  - sectionName: Secrets managers, PKI and platform tokens
    policyGroups:
    - fieldName: Environment Variable
      booleanOperator: OR
      values:
      - value: RAW=(?-i:.*)=(?-i:.*\bA3-[A-Z0-9]{6}-(?:(?:[A-Z0-9]{11})|(?:[A-Z0-9]{6}-[A-Z0-9]{5}))-[A-Z0-9]{5}-[A-Z0-9]{5}-[A-Z0-9]{5}\b.*)
      - value: RAW=(?-i:.*)=(?-i:.*ops_eyJ[a-zA-Z0-9+/]{250,}\x3d{0,3}.*)
      - value: RAW=(?-i:.*)=(?-i:.*AGE-SECRET-KEY-1[QPZRY9X8GF2TVDW0S3JN54KHCE6MUA7L]{58}.*)
      - value: RAW=(?-i:.*)=(?-i:.*\b((?:sc|ext|scauth|authress)_(?i)[a-z0-9]{5,30}\.[a-z0-9]{4,6}\.(?-i:acc)[_-][a-z0-9-]{10,32}\.[a-z0-9+/_\x3d-]{30,120}).*)
      - value: RAW=(?-i:.*)=(?-i:.*dp\.pt\.(?i)[a-z0-9]{43}.*)
      - value: RAW=(?-i:.*)=(?-i:.*\b(s-s4t2(?:ud|af)-(?i)[abcdef0123456789]{64}).*)
      - value: RAW=(?-i:.*)=(?-i:.*\b(ey[a-zA-Z0-9]{17,}\.ey[a-zA-Z0-9\/\\_-]{17,}\.(?:[a-zA-Z0-9\/\\_-]{10,}\x3d{0,2})?).*)
      - value: RAW=(?-i:.*)=(?-i:.*\b(sha256~[\w-]{43})(?:[^\w-]|\z).*)
      - value: 'RAW=(?-i:.*)=(?-i:.*(?is)-----BEGIN[ A-Z0-9_-]{0,100}PRIVATE KEY(?: BLOCK)?-----.*)'
      - value: RAW=(?-i:.*)=(?-i:.*\b(hvb\.[\w-]{138,300}).*)
      - value: RAW=(?-i:.*)=(?-i:.*\b((?:hvs\.[\w-]{90,120}|s\.(?i:[a-z0-9]{24}))).*)
  - sectionName: Source control and CI/CD
    policyGroups:
    - fieldName: Environment Variable
      booleanOperator: OR
      values:
      - value: RAW=(?-i:.*)=(?-i:.*(?:ghu|ghs)_[0-9a-zA-Z]{36}.*)
      - value: RAW=(?-i:.*)=(?-i:.*github_pat_\w{82}.*)
      - value: RAW=(?-i:.*)=(?-i:.*gho_[0-9a-zA-Z]{36}.*)
      - value: RAW=(?-i:.*)=(?-i:.*ghp_[0-9a-zA-Z]{36}.*)
      - value: RAW=(?-i:.*)=(?-i:.*ghr_[0-9a-zA-Z]{36}.*)
      - value: RAW=(?-i:.*)=(?-i:.*glcbt-[0-9a-zA-Z]{1,5}_[0-9a-zA-Z_-]{20}.*)
      - value: RAW=(?-i:.*)=(?-i:.*gldt-[0-9a-zA-Z_\-]{20}.*)
      - value: RAW=(?-i:.*)=(?-i:.*glffct-[0-9a-zA-Z_\-]{20}.*)
      - value: RAW=(?-i:.*)=(?-i:.*glft-[0-9a-zA-Z_\-]{20}.*)
      - value: RAW=(?-i:.*)=(?-i:.*glimt-[0-9a-zA-Z_\-]{25}.*)
      - value: RAW=(?-i:.*)=(?-i:.*glagent-[0-9a-zA-Z_\-]{50}.*)
      - value: RAW=(?-i:.*)=(?-i:.*gloas-[0-9a-zA-Z_\-]{64}.*)
      - value: RAW=(?-i:.*)=(?-i:.*glpat-[\w-]{20}.*)
      - value: RAW=(?-i:.*)=(?-i:.*\bglpat-[0-9a-zA-Z_-]{27,300}\.[0-9a-z]{2}[0-9a-z]{7}\b.*)
      - value: RAW=(?-i:.*)=(?-i:.*glptt-[0-9a-f]{40}.*)
      - value: RAW=(?-i:.*)=(?-i:.*GR1348941[\w-]{20}.*)
      - value: RAW=(?-i:.*)=(?-i:.*glrt-[0-9a-zA-Z_\-]{20}.*)
      - value: RAW=(?-i:.*)=(?-i:.*\bglrt-t\d_[0-9a-zA-Z_\-]{27,300}\.[0-9a-z]{2}[0-9a-z]{7}\b.*)
      - value: RAW=(?-i:.*)=(?-i:.*glsoat-[0-9a-zA-Z_\-]{20}.*)
      - value: RAW=(?-i:.*)=(?-i:.*(?:pat|sat)\.[a-zA-Z0-9_-]{22}\.[a-zA-Z0-9]{24}\.[a-zA-Z0-9]{20}.*)
      - value: RAW=(?-i:.*)=(?-i:.*(?i)[a-z0-9]{14}\.(?-i:atlasv1)\.[a-z0-9\-_\x3d]{60,70}.*)
      - value: RAW=(?-i:.*)=(?-i:.*\b(ico-[a-zA-Z0-9]{32}).*)
      - value: RAW=(?-i:.*)=(?-i:.*\b(API-[A-Z0-9]{26}).*)
      - value: RAW=(?-i:.*)=(?-i:.*\b(pul-[a-f0-9]{40}).*)
      - value: RAW=(?-i:.*)=(?-i:.*\b(rdme_[a-z0-9]{70}).*)
      - value: RAW=(?-i:.*)=(?-i:.*\b(sm_aat_[a-zA-Z0-9]{16}).*)
      - value: RAW=(?-i:.*)=(?-i:.*\b(sm_pat_[a-zA-Z0-9]{16}).*)
      - value: RAW=(?-i:.*)=(?-i:.*\b(sm_sat_[a-zA-Z0-9]{16}).*)
