apiVersion: batch/v1
kind: Job
metadata:
  name: cosign-sign-v2
  namespace: ai-email-demo
  labels:
    app.kubernetes.io/name: cosign-sign-v2
    app.kubernetes.io/part-of: ai-email-demo
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cosign-sign-v2
    spec:
      serviceAccountName: builder
      restartPolicy: Never
      initContainers:
        - name: sign
          # CRC's integrated registry validates ImageStream manifest-list
          # children as runnable images. Cosign 3's OCI index attachment omits
          # platform fields, so use the classic digest-tag format understood by
          # both this registry and RHACS.
          image: ghcr.io/sigstore/cosign/cosign:v2.4.3
          imagePullPolicy: IfNotPresent
          command:
            - cosign
            - sign
            - --yes
            - --tlog-upload=false
            - --allow-insecure-registry
            - --key
            - /keys/cosign.key
            - -a
            - release=v2
            - -a
            - purpose=rhacs-ai-demo
            - IMAGE_DIGEST_REFERENCE
          env:
            - name: DOCKER_CONFIG
              value: /auth
            - name: HOME
              value: /tmp
            - name: COSIGN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cosign-signing-key
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: registry-auth
              mountPath: /auth
              readOnly: true
            - name: signing-key
              mountPath: /keys
              readOnly: true
      containers:
        - name: verify
          image: ghcr.io/sigstore/cosign/cosign:v2.4.3
          imagePullPolicy: IfNotPresent
          command:
            - cosign
            - verify
            - --allow-insecure-registry
            - --insecure-ignore-tlog=true
            - --key
            - /keys/cosign.pub
            - IMAGE_DIGEST_REFERENCE
          env:
            - name: DOCKER_CONFIG
              value: /auth
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: registry-auth
              mountPath: /auth
              readOnly: true
            - name: signing-key
              mountPath: /keys
              readOnly: true
      volumes:
        - name: registry-auth
          secret:
            secretName: cosign-registry-auth
        - name: signing-key
          secret:
            secretName: cosign-signing-key
