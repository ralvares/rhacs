apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-state
  namespace: ai-email-demo
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 2Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: ai-email-demo
  labels: {app: openclaw, runtime: openclaw, release: v2}
spec:
  replicas: 1
  selector: {matchLabels: {app: openclaw}}
  template:
    metadata: {labels: {app: openclaw, runtime: openclaw}}
    spec:
      serviceAccountName: openclaw
      automountServiceAccountToken: false
      initContainers:
        - name: prepare-openclaw-home
          image: REGISTRY_ROUTE/ai-email-demo/openclaw:v1
          command: ["sh", "-c", "mkdir -p /state/workspace; if [ -d /opt/openclaw-workspace ]; then cp -R /opt/openclaw-workspace/. /state/workspace/; fi"]
          volumeMounts: [{name: state, mountPath: /state}]
          securityContext: &restricted
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
      containers:
        - name: openclaw
          image: REGISTRY_ROUTE/ai-email-demo/openclaw:v1
          command: ["node", "/opt/openclaw/openclaw.mjs", "gateway", "--bind", "lan", "--port", "8080"]
          env:
            - {name: HOME, value: /home/node}
            - {name: OPENCLAW_STATE_DIR, value: /home/node/.openclaw}
            - {name: OPENCLAW_CONFIG_PATH, value: /etc/openclaw/openclaw.json}
            - {name: IMAP_HOST, value: mail-server}
            - {name: IMAP_PORT, value: "3143"}
            - name: MAIL_USER
              valueFrom: {secretKeyRef: {name: mail-credentials, key: mail-user}}
            - name: MAIL_PASSWORD
              valueFrom: {secretKeyRef: {name: mail-credentials, key: mail-password}}
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom: {secretKeyRef: {name: openclaw-credentials, key: gateway-token}}
            - name: DEMO_API_KEY
              valueFrom: {secretKeyRef: {name: demo-runtime-context, key: demo-api-key}}
            - name: DEMO_REGION
              valueFrom: {secretKeyRef: {name: demo-runtime-context, key: demo-region}}
          ports: [{name: http, containerPort: 8080}]
          startupProbe: {httpGet: {path: /startupz, port: http}, failureThreshold: 30, periodSeconds: 5}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 30, periodSeconds: 15}
          volumeMounts:
            - {name: state, mountPath: /home/node/.openclaw}
            - {name: config, mountPath: /etc/openclaw/openclaw.json, subPath: openclaw.json, readOnly: true}
            - {name: runtime-context, mountPath: /home/node/.openclaw/workspace/.env, subPath: runtime-context, readOnly: true}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: "1", memory: 2Gi}
          securityContext: *restricted
      volumes:
        - {name: state, persistentVolumeClaim: {claimName: openclaw-state}}
        - {name: config, configMap: {name: openclaw-config}}
        - {name: runtime-context, secret: {secretName: demo-runtime-context, defaultMode: 292}}
