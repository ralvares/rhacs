apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openclaw-egress-after
  namespace: ai-email-demo
spec:
  podSelector:
    matchLabels: {app: openclaw}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
          podSelector:
            matchLabels:
              dns.operator.openshift.io/daemonset-dns: default
      ports:
        # OpenShift's dns-default Service exposes 53 and targets pod port 5353.
        - {protocol: UDP, port: 5353}
        - {protocol: TCP, port: 5353}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        # Keep the workstation's native Ollama API reachable while denying the
        # cross-namespace webhook on port 8080.
        - {protocol: TCP, port: 11434}
    - to:
        - podSelector:
            matchLabels: {app: mail-server}
      ports:
        - {protocol: TCP, port: 3143}
    - to:
        - podSelector:
            matchLabels: {app: approved-internal-service}
      ports:
        - {protocol: TCP, port: 8080}
