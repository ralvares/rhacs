apiVersion: image.openshift.io/v1
kind: ImageStream
metadata: {name: gitea, namespace: demo-platform}
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata: {name: gitea, namespace: demo-platform}
spec:
  source: {type: Binary}
  strategy:
    type: Docker
    dockerStrategy: {dockerfilePath: Dockerfile}
  output: {to: {kind: ImageStreamTag, name: "gitea:latest"}}
  successfulBuildsHistoryLimit: 2
  failedBuildsHistoryLimit: 2
