apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata: {name: gitea-push, namespace: demo-platform}
spec:
  params:
    - {name: revision, value: $(body.after)}
    - {name: image-tag, value: "pipeline-$(body.after)"}
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata: {name: openclaw-release, namespace: demo-platform}
spec:
  params:
    - {name: revision}
    - {name: image-tag}
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: openclaw-release-
        namespace: demo-platform
        labels:
          app.kubernetes.io/name: openclaw-release
          triggers.tekton.dev/eventlistener: gitea
      spec:
        pipelineRef: {name: openclaw-release}
        taskRunTemplate: {serviceAccountName: pipeline}
        params:
          - {name: git-url, value: "http://gitea.demo-platform.svc.cluster.local:3000/developer/demo-app.git"}
          - {name: revision, value: $(tt.params.revision)}
          - {name: image-tag, value: $(tt.params.image-tag)}
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                resources: {requests: {storage: 3Gi}}
          - name: rox-api-token-auth
            secret: {secretName: rox-api-token}
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata: {name: gitea, namespace: demo-platform}
spec:
  serviceAccountName: pipeline
  triggers:
    - name: protected-main-push
      interceptors:
        - ref: {name: cel}
          params:
            - name: filter
              value: >-
                header.canonical('Authorization').compareSecret('token', 'gitea-webhook-token') &&
                header.match('X-Gitea-Event', 'push') &&
                body.ref == 'refs/heads/main' &&
                body.repository.full_name == 'developer/demo-app'
      bindings: [{ref: gitea-push}]
      template: {ref: openclaw-release}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata: {name: gitea-webhook, namespace: demo-platform}
spec:
  to: {kind: Service, name: el-gitea}
  port: {targetPort: http-listener}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
