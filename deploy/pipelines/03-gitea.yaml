apiVersion: v1
kind: ConfigMap
metadata: {name: gitea-config, namespace: demo-platform}
data:
  app.ini: |
    APP_NAME = AI Workload Demo Git
    RUN_MODE = prod
    RUN_USER = git

    [database]
    DB_TYPE = sqlite3
    PATH = /data/gitea/gitea.db

    [repository]
    ROOT = /data/git/repositories

    [server]
    HTTP_PORT = 3000
    ROOT_URL = GITEA_ROOT_URL
    START_SSH_SERVER = true
    BUILTIN_SSH_SERVER_USER = git
    SSH_USER = git
    SSH_DOMAIN = gitea.demo-platform.svc.cluster.local
    SSH_PORT = 2222
    SSH_LISTEN_PORT = 2222

    [security]
    INSTALL_LOCK = true

    [service]
    DISABLE_REGISTRATION = true

    [webhook]
    ALLOWED_HOST_LIST = private
    SKIP_TLS_VERIFY = true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: demo-platform
  labels: {app: gitea, app.kubernetes.io/part-of: ai-email-security-demo}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: gitea}}
  template:
    metadata: {labels: {app: gitea}}
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: initialize
          image: image-registry.openshift-image-registry.svc:5000/demo-platform/gitea:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-ec"]
          args:
            - |
              mkdir -p /data/gitea/conf
              cp /config/app.ini /data/gitea/conf/app.ini
              gitea migrate --config /data/gitea/conf/app.ini
              gitea admin user create --config /data/gitea/conf/app.ini --username "$GITEA_USER" --password "$GITEA_PASSWORD" --email developer@demo.test --admin --must-change-password=false || true
          envFrom: [{secretRef: {name: developer-platform-credentials}}]
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /config, readOnly: true}
          securityContext: &restricted
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gitea
          image: image-registry.openshift-image-registry.svc:5000/demo-platform/gitea:latest
          imagePullPolicy: Always
          args: ["web", "--config", "/data/gitea/conf/app.ini"]
          envFrom: [{secretRef: {name: developer-platform-credentials}}]
          ports:
            - {name: http, containerPort: 3000}
            - {name: ssh, containerPort: 2222}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /config, readOnly: true}
          readinessProbe: {httpGet: {path: /api/healthz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /api/healthz, port: http}, initialDelaySeconds: 30, periodSeconds: 15}
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {cpu: 500m, memory: 768Mi}
          securityContext: *restricted
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: gitea-data}}
        - {name: config, configMap: {name: gitea-config}}
---
apiVersion: v1
kind: Service
metadata: {name: gitea, namespace: demo-platform}
spec:
  selector: {app: gitea}
  ports:
    - {name: http, port: 3000, targetPort: http}
    - {name: ssh, port: 2222, targetPort: ssh}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata: {name: gitea, namespace: demo-platform}
spec:
  to: {kind: Service, name: gitea}
  port: {targetPort: http}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
