apiVersion: v1
kind: ServiceAccount
metadata:
  name: mail-server
  namespace: ai-email-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: webmail
  namespace: ai-email-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mail-api
  namespace: ai-email-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: document-agent
  namespace: ai-email-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw
  namespace: ai-email-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-sink
  namespace: ai-email-demo
---
# The workloads need no Kubernetes API access, so their ServiceAccounts have no
# RoleBindings. This read-only Role can be bound to a presenter if desired.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: demo-presenter-readonly
  namespace: ai-email-demo
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]
