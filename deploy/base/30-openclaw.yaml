apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-state
  namespace: ai-email-demo
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 2Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: ai-email-demo
  labels: {app: openclaw, runtime: openclaw}
spec:
  replicas: 1
  # OpenClaw owns one state directory and takes an exclusive gateway lock.
  # Never overlap old and new replicas during an image promotion.
  strategy: {type: Recreate}
  selector: {matchLabels: {app: openclaw}}
  template:
    metadata:
      labels: {app: openclaw, runtime: openclaw}
      annotations:
        demo.rhacs.ai/runtime: openclaw
        demo.rhacs.ai/expected-child-processes: sh,python3,curl
        demo.rhacs.ai/expected-flow: openclaw-to-demo-webhook-cross-namespace
    spec:
      serviceAccountName: openclaw
      automountServiceAccountToken: false
      initContainers:
        - name: prepare-openclaw-home
          image: IMAGE_REGISTRY/ai-email-demo/openclaw:v1
          imagePullPolicy: Always
          command: ["sh", "-c", "mkdir -p /state/workspace; if [ -d /opt/openclaw-workspace ]; then cp -R /opt/openclaw-workspace/. /state/workspace/; fi"]
          volumeMounts:
            - {name: state, mountPath: /state}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
        - name: prepare-openclaw-state
          image: IMAGE_REGISTRY/ai-email-demo/openclaw:v1
          imagePullPolicy: Always
          # Keep OpenClaw's SQLite identity state. Conversation cleanup uses the
          # supported sessions API, so a rollout never forgets the demo browser.
          command: ["sh", "-c", "rm -f /state/exec-approvals.json /state/workspace/openclaw-workspace-state.json /state/workspace.attested*; rm -rf /state/workspace/.openclaw /state/workspace-attestations /state/logs/stability; cp /defaults/openclaw.json /state/openclaw.json; chmod 0600 /state/openclaw.json"]
          volumeMounts:
            - {name: state, mountPath: /state}
            - {name: config, mountPath: /defaults, readOnly: true}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
        - name: configure-exec-approvals
          image: IMAGE_REGISTRY/ai-email-demo/openclaw:v1
          imagePullPolicy: Always
          command: ["sh", "-c", "node /opt/openclaw/openclaw.mjs approvals set --stdin < /defaults/exec-approvals.json"]
          env:
            - {name: HOME, value: /tmp}
            - {name: OPENCLAW_HOME, value: /home/node}
            - {name: OPENCLAW_STATE_DIR, value: /home/node/.openclaw}
            - {name: OPENCLAW_CONFIG_PATH, value: /home/node/.openclaw/openclaw.json}
            - name: INFERENCE_API_TOKEN
              valueFrom:
                secretKeyRef: {name: inference-credentials, key: api-token}
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef: {name: openclaw-credentials, key: gateway-token}
          volumeMounts:
            - {name: config, mountPath: /defaults, readOnly: true}
            - {name: state, mountPath: /home/node/.openclaw}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
      containers:
        - name: openclaw
          image: IMAGE_REGISTRY/ai-email-demo/openclaw:v1
          imagePullPolicy: Always
          command: ["node", "/opt/openclaw/openclaw.mjs", "gateway", "--bind", "lan", "--port", "8080"]
          env:
            - {name: HOME, value: /tmp}
            - {name: OPENCLAW_HOME, value: /home/node}
            - {name: OPENCLAW_STATE_DIR, value: /home/node/.openclaw}
            - {name: OPENCLAW_CONFIG_PATH, value: /home/node/.openclaw/openclaw.json}
            - {name: OPENCLAW_WORKSPACE_DIR, value: /home/node/.openclaw/workspace}
            - {name: OPENCLAW_DISABLE_BONJOUR, value: "1"}
            - name: INFERENCE_API_TOKEN
              valueFrom:
                secretKeyRef: {name: inference-credentials, key: api-token}
            - name: OLLAMA_API_KEY
              valueFrom:
                secretKeyRef: {name: inference-credentials, key: api-token}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: {name: inference-credentials, key: api-token}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: {name: inference-credentials, key: api-token}
            - {name: IMAP_HOST, value: mail-server}
            - {name: IMAP_PORT, value: "3143"}
            - name: MAIL_USER
              valueFrom:
                secretKeyRef: {name: mail-credentials, key: mail-user}
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef: {name: mail-credentials, key: mail-password}
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef: {name: openclaw-credentials, key: gateway-token}
          ports: [{name: http, containerPort: 8080}]
          volumeMounts:
            - {name: state, mountPath: /home/node/.openclaw}
            - {name: runtime-context, mountPath: /home/node/.openclaw/workspace/.env, subPath: runtime-context, readOnly: true}
          # OpenClaw 2026.8 validates forwarded-client attribution before HTTP
          # auth. TCP probes avoid making the kubelet look like the Route proxy.
          startupProbe: {tcpSocket: {port: http}, failureThreshold: 30, periodSeconds: 5}
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: http}, initialDelaySeconds: 30, periodSeconds: 15}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: "1", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: config
          configMap: {name: openclaw-config}
        - name: state
          persistentVolumeClaim: {claimName: openclaw-state}
        - name: runtime-context
          secret: {secretName: demo-runtime-context, defaultMode: 292}
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw
  namespace: ai-email-demo
spec:
  selector: {app: openclaw}
  ports: [{name: http, port: 8080, targetPort: http}]
